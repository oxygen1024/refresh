<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px system-ui, sans-serif; width: 240px; margin: 0; padding: 14px; background: #fff; color: #111; }
  h1 { font-size: 16px; margin: 0 0 10px; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
  button { font: inherit; padding: 8px 0; border: 1px solid #ccc; border-radius: 6px; background: #f5f5f5; cursor: pointer; }
  button.sel { background: #16a34a; color: #fff; border-color: #16a34a; }
  .row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
  input { font: inherit; width: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 6px; }
  #start { flex: 1; background: #16a34a; color: #fff; border-color: #16a34a; }
  #stop { flex: 1; background: #dc2626; color: #fff; border-color: #dc2626; }
  #status { font-size: 13px; color: #555; margin-top: 8px; }
</style>
</head>
<body>
  <h1>Auto Refresh 自動重新整理</h1>
  <div class="presets">
    <button data-s="0.1">0.1s</button>
    <button data-s="0.5">0.5s</button>
    <button data-s="1">1s</button>
    <button data-s="3">3s</button>
    <button data-s="5">5s</button>
    <button data-s="10">10s</button>
  </div>
  <div class="row">
    <label for="sec">秒數 Seconds</label>
    <input id="sec" type="number" min="0.1" step="0.1" value="3">
  </div>
  <div class="row">
    <button id="start">Start 開始</button>
    <button id="stop">Stop 停止</button>
  </div>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
